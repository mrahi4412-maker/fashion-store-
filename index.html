<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium E-Commerce & Dashboard</title>
    <style>
        /* CSS Variables for Premium Theme */
        :root {
            --bg-color: #f4f6f8;
            --text-color: #2c3e50;
            --primary-color: #111827;
            --accent-color: #f59e0b; /* Gold/Amber for premium brand feel */
            --card-bg: #ffffff;
            --border-radius: 12px;
        }

        /* Auto Dark Mode Support */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --text-color: #f8fafc;
                --primary-color: #000000;
                --card-bg: #1e293b;
            }
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 1. High-Quality Brand Header */
        header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 2px solid var(--accent-color);
            padding: 8px 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        nav a {
            color: #e2e8f0;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* 2. Real-Time Admin Dashboard Section */
        .dashboard-header {
            padding: 2rem 5% 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .dashboard {
            padding: 1.5rem 5%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-card h3 { 
            margin: 0; 
            font-size: 1rem; 
            color: #64748b; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value { 
            font-size: 2.5rem; 
            font-weight: 800; 
            margin-top: 10px; 
            color: var(--text-color);
        }

        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* 3. E-Commerce Products Section */
        .products-header {
            padding: 2rem 5% 0;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .products {
            padding: 1.5rem 5% 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .product-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background-color: #cbd5e1;
        }

        .product-info { 
            padding: 1.5rem; 
        }

        .product-title { 
            font-size: 1.3rem; 
            margin: 0 0 0.5rem 0; 
        }

        .product-price { 
            color: var(--accent-color); 
            font-weight: 800; 
            font-size: 1.5rem; 
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #ffffff;
            text-align: center;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background-color 0.2s;
        }

        .btn:hover { 
            background-color: var(--accent-color); 
            color: #000000;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1rem; }
            nav a { margin: 0 10px; }
        }
    </style>
</head>
<body>

    <!-- Header & Brand Logo -->
    <header>
        <div class="brand-logo">LuxeBrand</div>
        <nav>
            <a href="#">Store</a>
            <a href="#">Categories</a>
            <a href="#">Cloud Sync</a>
            <a href="#">Cart (3)</a>
        </nav>
    </header>

    <!-- Real-Time Dashboard -->
    <div class="dashboard-header">Live Sales Dashboard <span class="live-indicator"></span></div>
    <section class="dashboard">
        <div class="stat-card">
            <h3>Active Customers on Site</h3>
            <div class="value" id="active-users">245</div>
        </div>
        <div class="stat-card">
            <h3>Orders Today</h3>
            <div class="value" id="today-orders">89</div>
        </div>
        <div class="stat-card">
            <h3>Total Revenue (Live)</h3>
            <div class="value" id="live-revenue">₹1,24,500</div>
        </div>
    </section>

    <!-- E-Commerce Storefront -->
    <div class="products-header">Premium Collection</div>
    <section class="products">
        
        <!-- Product 1 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Smart Watch" class="product-img">
            <div class="product-info">
                <h3 class="product-title">Luxury Smartwatch Series X</h3>
                <div class="product-price">₹12,999</div>
                <button class="btn" onclick="addOrder(12999)">Add to Cart</button>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Headphones" class="product-img">
            <div class="product-info">
                <h3 class="product-title">Noise Cancelling Headphones</h3>
                <div class="product-price">₹8,499</div>
                <button class="btn" onclick="addOrder(8499)">Add to Cart</button>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Camera" class="product-img">
            <div class="product-info">
                <h3 class="product-title">Vintage DSLR Camera</h3>
                <div class="product-price">₹45,000</div>
                <button class="btn" onclick="addOrder(45000)">Add to Cart</button>
            </div>
        </div>

    </section>

    <!-- JavaScript for Real-Time Dashboard Simulation -->
    <script>
        // Real-time Active Users Simulation
        setInterval(() => {
            const usersElement = document.getElementById('active-users');
            let currentUsers = parseInt(usersElement.innerText);
            // Randomly increase or decrease users by a small amount
            let change = Math.floor(Math.random() * 11) - 5; 
            let newUsers = currentUsers + change;
            usersElement.innerText = newUsers > 50 ? newUsers : 50; // Keep minimum 50
        }, 3500);

        // Function to simulate a new order being placed
        let totalRevenue = 124500;
        let totalOrders = 89;

        function addOrder(price) {
            totalOrders++;
            totalRevenue += price;
            
            // Update UI with animation effect
            document.getElementById('today-orders').innerText = totalOrders;
            document.getElementById('live-revenue').innerText = '₹' + totalRevenue.toLocaleString('en-IN');
            
            alert("Item added to cart! Dashboard updated in real-time.");
        }
    </script>
</body>
</html>
